<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobHunt One</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p>JobHunt One</p>
      <h1>Portal Capture</h1>
    </header>

    <main>
      <section class="status" id="portalStatus">Checking current tab...</section>

      <button class="primary" id="captureBtn" type="button">Capture Current Job</button>

      <div class="button-grid">
        <button id="openWorkspaceBtn" type="button">Open Workspace</button>
        <button id="copyBtn" type="button">Copy JSON</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>

      <section class="jobs">
        <div class="jobs-heading">
          <h2>Captured Jobs</h2>
          <span id="jobCount">0</span>
        </div>
        <div class="job-list" id="jobList"></div>
      </section>
    </main>

    <footer id="feedback">LinkedIn and Dice job detail pages are supported.</footer>
    <script src="popup.js"></script>
  </body>
</html>
